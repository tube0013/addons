---
version: 0.2.3-tcp-test
slug: ziggurat
name: Ziggurat Zigbee Server
description: Open source host-side Zigbee stack written in Rust
url: https://github.com/zigpy/ziggurat
arch:
  - aarch64
  - amd64
stage: experimental
init: false
startup: services
uart: true
# Boosting priority (negative nice) inside a container requires CAP_SYS_NICE
privileged:
  - SYS_NICE
options:
  device: null
  network_address: null
  baudrate: 460800
  flow_control: hardware
  log_level: info
schema:
  device: device(subsystem=tty)?
  network_address: str?
  baudrate: int
  flow_control: list(hardware|software|none)
  log_level: list(error|warn|info|debug|trace)
ports:
  9999/tcp: 9999
ports_description:
  9999/tcp: WebSocket API
# Testing build (PR #39 / tube0013 fork): built locally from ./Dockerfile instead of
# pulling the published image. Restore this before merging back upstream.
# image: ghcr.io/zigpy/ziggurat-addon
