---
configuration:
  device:
    name: Device
    description: >-
      The serial port where the OpenThread RCP radio is attached. Ignored if
      Network Address is set.
  network_address:
    name: Network Address
    description: >-
      Connect to the RCP over TCP instead of a local serial port, e.g.
      tcp://192.168.1.50:6638. Takes priority over Device when set.
  baudrate:
    name: Baudrate
    description: The serial baudrate of the RCP firmware.
  flow_control:
    name: Flow control
    description: >-
      The serial flow control mode. The RCP UART drops bytes under load without
      hardware flow control; only change this if the radio's firmware was built
      without it.
  log_level:
    name: Log level
    description: >-
      The stack's logging verbosity. Debug logs every frame on the network and
      is very chatty; info is appropriate for normal operation.
network:
  9999/tcp: WebSocket API
